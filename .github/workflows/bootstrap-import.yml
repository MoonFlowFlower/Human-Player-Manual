name: Bootstrap source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged archive
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part-03
          cat .bootstrap/part-* > /tmp/earth-source.tar.xz
          mkdir -p /tmp/earth-import
          tar -xJf /tmp/earth-source.tar.xz -C /tmp/earth-import
          test -f /tmp/earth-import/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/earth-import/. .

      - name: Verify imported source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Human Player Manual source"
          git push origin HEAD:main
