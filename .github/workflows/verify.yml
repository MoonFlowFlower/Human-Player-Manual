name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser QA tools and Chinese fonts
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise production HTTP pages and native local records
        run: |
          node scripts/dev.mjs --dist > /tmp/manual-preview.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          python qa/browser_check.py --base-url http://127.0.0.1:4173
          python qa/interaction_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-site-and-browser-evidence
          path: |
            dist/
            qa/results/
          retention-days: 14
          if-no-files-found: error
