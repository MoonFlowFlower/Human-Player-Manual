name: Import Source

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged payload
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/011
          cat .bootstrap/[0-9][0-9][0-9] > /tmp/human-player-manual.tar.xz
          echo "06b0d5e66a612649dc49d7c73a3deb7e6972af680bdaadd34e2004e602ac95d7  /tmp/human-player-manual.tar.xz" | sha256sum -c -
          mkdir -p /tmp/hpm-source
          tar -xJf /tmp/human-player-manual.tar.xz -C /tmp/hpm-source
          test -f /tmp/hpm-source/package.json
          test -f /tmp/hpm-source/README.md
          test -f /tmp/hpm-source/src/app.ts

      - name: Install source into repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/hpm-source/. .
          rm -rf .bootstrap

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Human Player Manual source"
          git push origin HEAD:main
